# Cutover rehearsal: a copy of the live site (from a SiteGround backup) on http://localhost:8091,
# kept apart from the dev stack. Load it with rehearsal/load.sh, then run bin/cutover.sh against it.
name: djm-rehearsal

x-wp-env: &wp-env
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_NAME: wordpress
  WORDPRESS_DB_USER: wordpress
  WORDPRESS_DB_PASSWORD: wordpress
  WORDPRESS_TABLE_PREFIX: tav_
  WORDPRESS_DEBUG: 1
  WORDPRESS_CONFIG_EXTRA: |
    define( 'WP_ENVIRONMENT_TYPE', 'local' );
    define( 'WP_DEBUG_LOG', true );
    define( 'WP_DEBUG_DISPLAY', false );

# The theme, ACF Pro and seed media stand in for the files uploaded to SiteGround before the cutover.
x-wp-volumes: &wp-volumes
  - wp:/var/www/html
  - ../djmichael:/var/www/html/wp-content/themes/djmichael
  - ../plugins/advanced-custom-fields-pro:/var/www/html/wp-content/plugins/advanced-custom-fields-pro
  - ../dev/mu-plugins/djm-local-mail.php:/var/www/html/wp-content/mu-plugins/djm-local-mail.php:ro
  - ../seed/media:/seed-media:ro
  - ${BACKUP_DIR:-.}:/backup:ro

services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db:/var/lib/mysql

  wordpress:
    image: wordpress:php8.2-apache
    depends_on: [db]
    ports:
      - "8091:80"
    # Live's .htaccess uses Header, which the stock image doesn't load.
    command: sh -c "a2enmod -q headers && exec docker-entrypoint.sh apache2-foreground"
    environment: *wp-env
    volumes: *wp-volumes

  cli:
    image: wordpress:cli-php8.2
    user: "33:33"
    depends_on: [db, wordpress]
    environment: *wp-env
    volumes: *wp-volumes
    profiles: [cli]

  mailpit:
    image: axllent/mailpit
    ports:
      - "8036:8025"

volumes:
  db:
  wp:
